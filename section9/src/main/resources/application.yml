spring:
  application:
    name: section9
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
  docker:
    compose:
      stop:
        command: down
  datasource:
    url: jdbc:h2:file:~/chatmemory;AUTO_SERVER=true
    driver-class-name: org.h2.Driver
    username: madan
    password: 12345
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update

logging:
  pattern:
    console: '%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n'
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus

audit:
  token-usage:
    enabled: true