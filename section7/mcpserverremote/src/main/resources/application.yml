spring:
  application:
    name: mcpserverremote
  datasource:
    url: jdbc:h2:file:~/chatmemory;AUTO_SERVER=true
    driver-class-name: org.h2.Driver
    username: madan
    password: 12345
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        protocol: streamable
        name: helpdesk-mcp-server

server:
  port: 8090

logging:
  pattern:
    console: '%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n'
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
