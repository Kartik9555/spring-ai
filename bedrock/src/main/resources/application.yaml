spring:
  application:
    name: bedrock
  ai:
    model:
      chat: bedrock-converse
    bedrock:
      aws:
        region: us-east-1
        access-key: ""
        secret-key: ""
      converse:
        chat:
          options:
            model: apac.anthropic.claude-sonnet-4-20250514-v1:0


logging:
  pattern:
    console: '%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n'